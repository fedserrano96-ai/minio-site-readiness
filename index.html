<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Mini·O Site Readiness Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="build/assessment/main.css">
  <style>
    /* ── RESET ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* ── BRAND VARIABLES ────────────────────────────────────── */
    :root {
      --red:       #ED3648;
      --dark-blue: #535266;
      --slate:     #9398A5;
      --sand:      #E3CDBF;
      --white:     #FFFFFF;

      --status-ready:    #4CAF50;
      --status-action:   #F5A623;
      --status-find-out: #9398A5;
      --status-blocker:  #ED3648;

      --nav-height: 68px;
    }

    /* ── BASE ───────────────────────────────────────────────── */
    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      color: var(--dark-blue);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── APP SHELL ──────────────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ── HEADER ─────────────────────────────────────────────── */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--white);
      box-shadow: 0 1px 0 rgba(147, 152, 165, 0.2);
    }

    .header-bar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 12px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .header-logo svg {
      height: 44px;
      width: auto;
    }

    .header-step-badge {
      margin-left: auto;
      font-size: 12px;
      font-weight: 600;
      color: var(--slate);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .progress-track {
      height: 4px;
      background: rgba(147, 152, 165, 0.22);
    }

    .progress-fill {
      height: 100%;
      background: var(--red);
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .step-label-bar {
      padding: 5px 16px 8px;
    }

    .step-label-text {
      font-size: 11px;
      font-weight: 500;
      color: var(--slate);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── MAIN CONTENT ───────────────────────────────────────── */
    .app-content {
      flex: 1;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 28px 16px calc(var(--nav-height) + 28px);
    }

    /* Steps hidden by default, visible when active */
    .step-panel {
      display: none;
    }

    .step-panel.active {
      display: block;
    }

    /* ── STEP HEADINGS ──────────────────────────────────────── */
    .step-heading {
      font-size: 22px;
      font-weight: 700;
      color: var(--dark-blue);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .step-subheading {
      font-size: 15px;
      font-weight: 400;
      color: var(--slate);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* ── FORM ELEMENTS ──────────────────────────────────────── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 28px;
    }

    .form-group:last-of-type {
      margin-bottom: 0;
    }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--dark-blue);
      line-height: 1;
    }

    .form-label .optional-tag {
      font-size: 12px;
      font-weight: 400;
      color: var(--slate);
      margin-left: 5px;
    }

    .form-input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1.5px solid rgba(147, 152, 165, 0.35);
      border-radius: 8px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: var(--dark-blue);
      background: var(--white);
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      touch-action: manipulation;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--dark-blue);
      box-shadow: 0 0 0 3px rgba(83, 82, 102, 0.08);
    }

    .form-input.input-error {
      border-color: var(--red);
    }

    .form-input::placeholder {
      color: rgba(147, 152, 165, 0.65);
    }

    .form-input--address {
      /* same height, just semantic differentiation for now */
    }

    .form-row-tablet-wrapper {
      margin-bottom: 28px;
    }

    .field-hint {
      font-size: 12px;
      color: var(--slate);
      line-height: 1.4;
      margin-top: -2px;
    }

    .field-error {
      font-size: 12px;
      color: var(--red);
      font-weight: 500;
      line-height: 1.4;
      margin-top: -2px;
      display: none;
    }

    .field-error.visible {
      display: block;
    }

    /* ── BOTTOM NAVIGATION ──────────────────────────────────── */
    .app-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: var(--white);
      border-top: 1px solid rgba(147, 152, 165, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 200;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      border-radius: 8px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s, box-shadow 0.15s;
      touch-action: manipulation;
      border: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:disabled {
      cursor: default;
      pointer-events: none;
    }

    .btn-back {
      padding: 0 24px;
      background: transparent;
      border: 1.5px solid rgba(147, 152, 165, 0.4);
      color: var(--dark-blue);
      min-width: 96px;
    }

    .btn-back:hover {
      background: rgba(147, 152, 165, 0.08);
    }

    .btn-back:disabled {
      opacity: 0.35;
    }

    .btn-next {
      padding: 0 32px;
      background: var(--red);
      color: var(--white);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      min-width: 112px;
    }

    .btn-next:hover:not(:disabled) {
      background: #d62f41;
      box-shadow: 0 2px 12px rgba(237, 54, 72, 0.3);
    }

    .btn-next:disabled {
      background: rgba(147, 152, 165, 0.3);
      color: rgba(255, 255, 255, 0.7);
    }

    /* ── PLACEHOLDER STEPS ──────────────────────────────────── */
    .placeholder-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 48px 0;
      gap: 14px;
    }

    .placeholder-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--sand);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--slate);
    }

    .placeholder-content h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--dark-blue);
    }

    .placeholder-content p {
      font-size: 15px;
      color: var(--slate);
      line-height: 1.55;
      max-width: 280px;
    }

    .phase-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      background: rgba(147, 152, 165, 0.12);
      border: 1px solid rgba(147, 152, 165, 0.25);
      border-radius: 20px;
      padding: 4px 12px;
    }

    /* ── EMAIL VALIDATION STATE ─────────────────────────────── */
    .validation-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: -2px;
    }

    .validation-row svg {
      flex-shrink: 0;
    }

    /* ── TABLET / DESKTOP ───────────────────────────────────── */
    @media (min-width: 768px) {
      .app-content {
        padding: 36px 24px calc(var(--nav-height) + 36px);
      }

      .header-bar {
        padding: 12px 24px;
      }

      .step-label-bar {
        padding: 5px 24px 10px;
      }

      .app-nav {
        padding: 0 24px;
      }

      .step-heading {
        font-size: 28px;
      }

      .step-subheading {
        font-size: 16px;
        margin-bottom: 36px;
      }

      .form-row-tablet {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .form-row-tablet .form-group {
        margin-bottom: 0;
      }

      .form-row-tablet-wrapper {
        margin-bottom: 28px;
      }
    }

    @media (min-width: 1024px) {
      .app-content {
        padding: 48px 32px calc(var(--nav-height) + 48px);
        max-width: 680px;
      }
    }

    /* ── QUESTION STEPS ──────────────────────────────────────── */
    .step-intro {
      padding: 24px 16px 12px;
    }
    .step-intro-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--dark-blue);
      margin-bottom: 8px;
    }
    .step-intro-text {
      font-size: 15px;
      color: var(--slate);
      line-height: 1.6;
    }
    .question-list {
      padding: 0 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .question-card {
      background: var(--white);
      border: 1.5px solid rgba(147, 152, 165, 0.22);
      border-radius: 10px;
      padding: 20px;
    }
    .question-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--dark-blue);
      line-height: 1.45;
      margin-bottom: 14px;
    }
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      background: var(--white);
      border: 1.5px solid rgba(83, 82, 102, 0.28);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--dark-blue);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.35;
    }
    .option-btn.selected {
      background: var(--dark-blue);
      border-color: var(--dark-blue);
      color: var(--white);
    }
    .option-btn.opt-unsure {
      border-color: var(--slate);
      color: var(--slate);
    }
    .option-btn.opt-unsure.selected {
      background: var(--slate);
      border-color: var(--slate);
      color: var(--white);
    }
    .option-radio {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .option-btn.selected .option-radio::after {
      content: '';
      width: 8px;
      height: 8px;
      background: currentColor;
      border-radius: 50%;
      display: block;
    }
    .option-extra-input {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      border: 1.5px solid rgba(83, 82, 102, 0.28);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--dark-blue);
      background: #f9f9f9;
      resize: vertical;
      min-height: 56px;
      display: none;
      box-sizing: border-box;
    }
    .option-extra-input.visible {
      display: block;
    }
    .option-extra-input:focus {
      outline: none;
      border-color: var(--dark-blue);
      background: var(--white);
    }
    .micro-guide {
      display: none;
      margin-top: 12px;
      background: var(--sand);
      border-left: 4px solid var(--slate);
      border-radius: 0 8px 8px 0;
      padding: 14px 14px 14px 16px;
      gap: 10px;
      align-items: flex-start;
    }
    .micro-guide.visible {
      display: flex;
    }
    .micro-guide-icon {
      flex-shrink: 0;
      color: var(--slate);
      margin-top: 1px;
    }
    .micro-guide-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 5px;
    }
    .micro-guide-text {
      font-size: 14px;
      color: var(--dark-blue);
      line-height: 1.55;
    }
    .cond-section.hidden {
      display: none;
    }
    .section-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }
    .section-divider-line {
      flex: 1;
      height: 1px;
      background: rgba(147, 152, 165, 0.3);
    }
    .section-divider-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      white-space: nowrap;
    }

    /* ── READINESS REPORT ────────────────────────────────────── */
    .report-wrapper {
      display: none;
      padding: 0 0 100px;
      animation: fadeSlideUp 0.4s ease;
    }
    .report-wrapper.visible {
      display: block;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .contact-form-wrapper {
      transition: opacity 0.2s ease;
    }
    .contact-form-wrapper.hidden {
      display: none;
    }
    .report-hero {
      padding: 28px 16px 20px;
      border-bottom: 1px solid rgba(147,152,165,0.2);
    }
    .report-hero-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 6px;
    }
    .report-hero-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--dark-blue);
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .report-hero-sub {
      font-size: 15px;
      color: var(--slate);
      line-height: 1.5;
    }
    .report-section-cards {
      padding: 20px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .report-card {
      background: var(--white);
      border: 1.5px solid rgba(147,152,165,0.2);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .report-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .report-card-body {
      flex: 1;
      min-width: 0;
    }
    .report-card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--dark-blue);
      margin-bottom: 2px;
    }
    .report-card-status {
      font-size: 13px;
      font-weight: 500;
    }
    .status-ready    { color: #4CAF50; }
    .status-action   { color: #F5A623; }
    .status-find-out { color: var(--slate); }
    .status-blocker  { color: var(--red); }
    .status-ready-bg    { background: rgba(76,175,80,0.12); }
    .status-action-bg   { background: rgba(245,166,35,0.12); }
    .status-find-out-bg { background: rgba(147,152,165,0.12); }
    .status-blocker-bg  { background: rgba(237,54,72,0.12); }
    .report-delivery {
      margin: 20px 16px 0;
      background: var(--dark-blue);
      border-radius: 12px;
      padding: 20px;
      color: var(--white);
    }
    .report-delivery-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 6px;
    }
    .report-delivery-method {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .report-delivery-note {
      font-size: 14px;
      line-height: 1.55;
      opacity: 0.82;
    }
    .report-checklist-section {
      margin: 20px 16px 0;
    }
    .report-checklist-heading {
      font-size: 18px;
      font-weight: 700;
      color: var(--dark-blue);
      margin-bottom: 14px;
    }
    .checklist-group {
      margin-bottom: 16px;
    }
    .checklist-group-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checklist-group-line {
      flex: 1;
      height: 1px;
      background: rgba(147,152,165,0.3);
    }
    .checklist-item {
      background: var(--white);
      border: 1.5px solid rgba(147,152,165,0.2);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .checklist-item-q {
      font-size: 14px;
      font-weight: 600;
      color: var(--dark-blue);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .checklist-item-guide {
      font-size: 13px;
      color: var(--slate);
      line-height: 1.55;
    }
    .report-evidence {
      margin: 20px 16px 0;
    }
    .report-evidence-heading {
      font-size: 18px;
      font-weight: 700;
      color: var(--dark-blue);
      margin-bottom: 6px;
    }
    .report-evidence-sub {
      font-size: 14px;
      color: var(--slate);
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .evidence-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(147,152,165,0.15);
    }
    .evidence-item:last-child { border-bottom: none; }
    .evidence-checkbox {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 2px solid rgba(147,152,165,0.5);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      margin-top: 1px;
    }
    .evidence-checkbox.checked {
      background: var(--dark-blue);
      border-color: var(--dark-blue);
    }
    .evidence-checkbox.checked::after {
      content: '';
      width: 12px;
      height: 7px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg) translateY(-1px);
      display: block;
    }
    .evidence-text {
      flex: 1;
    }
    .evidence-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--dark-blue);
      margin-bottom: 2px;
    }
    .evidence-desc {
      font-size: 13px;
      color: var(--slate);
      line-height: 1.45;
    }
    .report-submit-area {
      margin: 24px 16px 0;
    }
    .btn-submit-report {
      width: 100%;
      height: 56px;
      background: var(--red);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-submit-report:active { opacity: 0.88; }
    .btn-submit-report:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .report-submitted-msg {
      display: none;
      text-align: center;
      padding: 20px;
    }
    .report-submitted-msg.visible {
      display: block;
    }
    .submitted-icon {
      width: 56px;
      height: 56px;
      background: rgba(76,175,80,0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .submitted-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--dark-blue);
      margin-bottom: 10px;
    }
    .submitted-body {
      font-size: 15px;
      color: var(--slate);
      line-height: 1.6;
    }

    /* ── PLANNER: FULL-HEIGHT LOCK ──────────────────────────── */
    .app.planner-step {
      height: 100dvh;
      overflow: hidden;
    }

    .app.planner-step .app-content {
      padding: 0 0 68px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .app.planner-step #panel-0.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Planner body fills everything */
    .app.planner-step .planner-body {
      flex: 1;
      min-height: 0;
    }

                  <button class="add-obj-btn" data-obj-type="hottub">Hot tub</button>
                </div>
              </div>
            </div>
          </div>

        </div>

      </div><!-- /.planner-body -->


    </section>

    <!-- Step 2: Your Plan (screen 2, mounted by build/assessment/main.js) -->
    <section class="step-panel" id="panel-1" aria-label="Your plan">
      <div id="assessment-root"></div>
    </section>

  </main>

  <!-- ── STICKY BOTTOM NAV ─────────────────────────────────── -->
  <nav class="app-nav" id="app-nav" aria-label="Assessment navigation">
    <button class="btn btn-back" id="btn-back" disabled aria-label="Go to previous step">
      Back
    </button>
    <button class="btn btn-next" id="btn-next" disabled aria-label="Continue to next step">
      Next
    </button>
  </nav>

</div><!-- /.app -->

<!-- Screen 2 bundle (npm run build). Must come after #assessment-root. -->
<script src="build/assessment/main.js"></script>
<script>
'use strict';

/* ── STEP CONFIGURATION ───────────────────────────────────── */
const STEPS = [
  { label: 'Your Space', stepNum: 1 },
  { label: 'Your Plan',  stepNum: 2 },
];

const TOTAL_STEPS = STEPS.length;
// Holds only currentStep. Screen 2 keeps its own state (answers, planner snapshot).
const STORAGE_KEY = 'minio-assessment-v1';

/* ── STATE ────────────────────────────────────────────────── */
let state = {
  currentStep: 0,
};

/* ── PERSISTENCE ──────────────────────────────────────────── */
function saveState() {
  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ currentStep: state.currentStep }));
  } catch (e) {
    // sessionStorage unavailable; continue without persistence
  }
}

function loadState() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state.currentStep = saved.currentStep || 0;
    }
  } catch (e) {
    // Corrupted storage; start fresh
  }
}

/* ── DOM REFS ─────────────────────────────────────────────── */
const progressFill  = document.getElementById('progress-fill');
const stepBadge     = document.getElementById('step-badge');
const stepLabelText = document.getElementById('step-label-text');
const btnBack       = document.getElementById('btn-back');
const btnNext       = document.getElementById('btn-next');
const panels        = Array.from(document.querySelectorAll('.step-panel'));

/* ── VALIDATION ───────────────────────────────────────────── */
function isCurrentStepValid() {
  return true;
}

/* ── HEADER + PROGRESS UPDATE ─────────────────────────────── */
function updateHeader() {
  const step = STEPS[state.currentStep];
  const pct  = ((state.currentStep + 1) / TOTAL_STEPS * 100).toFixed(2);

  progressFill.style.width = pct + '%';
  progressFill.parentElement.setAttribute('aria-valuenow', Math.round(pct));
  stepBadge.textContent     = `Step ${step.stepNum} of ${TOTAL_STEPS}`;
  stepLabelText.textContent = step.label;
}

/* ── NAV BUTTON STATE ─────────────────────────────────────── */
function updateNavButtons() {
  const isFirst = state.currentStep === 0;
  const valid   = isCurrentStepValid();

  btnBack.disabled = isFirst;
  btnNext.disabled = !valid;

  btnNext.textContent = 'NEXT';
  btnNext.setAttribute('aria-label', 'Continue to next step');
}

/* ── PANEL DISPLAY ────────────────────────────────────────── */
function showStep(index) {
  panels.forEach((panel, i) => {
    panel.classList.toggle('active', i === index);
  });
  // Scroll content to top when step changes
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── RENDER ───────────────────────────────────────────────── */
function render() {
  updateHeader();
  showStep(state.currentStep);
  updateNavButtons();
  // Planner step needs a special full-height layout
  document.getElementById('app').classList.toggle('planner-step', state.currentStep === 0);
  // Screen 2 has its own Back / Next (and a bottom bar on phones)
  document.getElementById('app-nav').style.display = state.currentStep === 0 ? '' : 'none';
}

/* ── NAVIGATION ───────────────────────────────────────────── */
function goNext() {
  if (state.currentStep !== 0) return;
  window.MiniOAssessment.start(buildSnapshot());
  state.currentStep = 1;
  saveState();
  render();
}

btnNext.addEventListener('click', goNext);

/* ── KEYBOARD NAVIGATION ──────────────────────────────────── */
document.addEventListener('keydown', e => {
  // Screen 2 handles its own keys
  if (state.currentStep !== 0) return;
  // Allow Enter/Right on non-input elements to advance
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if ((e.key === 'ArrowRight' || e.key === 'Enter') && !btnNext.disabled) {
    goNext();
  }
});

/* ── PLANNER DATA ─────────────────────────────────────── */
const PODS = [
  { id: 'twelve',  name: 'The Twelve',  w: 12, d: 8,  label: '96 sq ft'  },
  { id: 'sixteen', name: 'The Sixteen', w: 16, d: 10, label: '160 sq ft' },
  { id: 'station', name: 'The Station', w: 30, d: 10, label: '300 sq ft' },
];

const YARD_OBJECT_DEFS = {
  tree:   { label: 'Tree',       w: 6,  h: 6,  shape: 'circle', fill: '#5B8B48', stroke: '#3D6030' },
  pool:   { label: 'Pool',       w: 10, h: 18, shape: 'rect',   fill: '#74BBDB', stroke: '#4E8FAD' },
  patio:  { label: 'Patio',      w: 14, h: 12, shape: 'rect',   fill: '#C2B49A', stroke: '#9A8E7A' },
  shed:   { label: 'Shed',       w: 8,  h: 10, shape: 'rect',   fill: '#A07848', stroke: '#7A5A32' },
  garden: { label: 'Garden',     w: 4,  h: 8,  shape: 'rect',   fill: '#6C9A54', stroke: '#4E7038' },
  hottub: { label: 'Hot tub',    w: 7,  h: 7,  shape: 'circle', fill: '#8AB8D4', stroke: '#5A8CAE' },
  bush:   { label: 'Bush',       w: 4,  h: 4,  shape: 'circle', fill: '#4E7A38', stroke: '#345228' },
  deck:   { label: 'Deck',       w: 16, h: 12, shape: 'rect',   fill: '#C8A878', stroke: '#A08050' },
};

const HIT_EXPAND = 20;  // px extra hit area for finger dragging

/* ── PLANNER STATE ─────────────────────────────────────── */
const planner = {
  pod:         PODS[0],
  rotation:    0,
  yardW:       40,
  yardD:       30,
  podX:        0,
  podY:        0,
  podUse:      'office',
  scale:       1,
  offsetX:     0,
  offsetY:     0,
  dragging:    false,
  dragOffX:    0,
  dragOffY:    0,
  dragTarget:  'pod', // 'pod' or object index
  objects:     [],    // placed yard objects
  selectedObj: -1,    // index of selected object, -1 = none
};

/* ── HAND-OFF TO SCREEN 2 ──────────────────────────────── */
// PlannerSnapshot (src/assessment/core/types.ts): pod centre and objects in feet.
function buildSnapshot() {
  return {
    model:    planner.pod.id,
    rotation: planner.rotation,
    yardW:    planner.yardW,
    yardD:    planner.yardD,
    podX:     planner.podX,
    podY:     planner.podY,
    podUse:   planner.podUse,
    objects:  planner.objects.map(({ type, x, y, w, h }) => ({ type, x, y, w, h })),
  };
}

function restorePlanner(s) {
  const pod = PODS.find(p => p.id === s.model);
  if (!pod) throw new Error('Saved plan has an unknown pod model: ' + s.model);
  planner.yardW = s.yardW;
  planner.yardD = s.yardD;
  ['yard-w-mobile', 'yard-w-sidebar'].forEach(id => { document.getElementById(id).value = s.yardW; });
  ['yard-d-mobile', 'yard-d-sidebar'].forEach(id => { document.getElementById(id).value = s.yardD; });
  selectPod(pod.id);
  setRotation(s.rotation);
  setPodUse(s.podUse);
  planner.podX = s.podX;
  planner.podY = s.podY;
  planner.objects = s.objects.map(o => {
    const def = YARD_OBJECT_DEFS[o.type];
    if (!def) throw new Error('Saved plan has an unknown yard object: ' + o.type);
    return { type: o.type, x: o.x, y: o.y, w: o.w, h: o.h, def };
  });
  planner.selectedObj = -1;
  fitToView();
}

/* ── CANVAS SETUP ──────────────────────────────────────── */
const canvas = document.getElementById('yard-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  const area = canvas.parentElement;
  if (!area) return;
  const dpr = window.devicePixelRatio || 1;
  const w = area.clientWidth;
  const h = area.clientHeight;
  if (!w || !h) return;
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fitToView();
}

const resizeObs = new ResizeObserver(() => resizeCanvas());

/* ── COORDINATE HELPERS ────────────────────────────────── */
function podDims() {
  const { w, d } = planner.pod;
  return planner.rotation === 90 ? { w: d, h: w } : { w, h: d };
}

function ftToPx(ft) { return ft * planner.scale; }

function yardToCanvas(fx, fy) {
  return [planner.offsetX + fx * planner.scale, planner.offsetY + fy * planner.scale];
}

function canvasToYard(cx, cy) {
  return [(cx - planner.offsetX) / planner.scale, (cy - planner.offsetY) / planner.scale];
}

function clampPod(fx, fy) {
  const { w, h } = podDims();
  return [
    Math.max(w / 2, Math.min(planner.yardW - w / 2, fx)),
    Math.max(h / 2, Math.min(planner.yardD - h / 2, fy)),
  ];
}

function fitToView() {
  const cssW = canvas.clientWidth;
  const cssH = canvas.clientHeight;
  if (!cssW || !cssH) return;
  const PAD = 44;
  const scaleX = (cssW - PAD * 2) / planner.yardW;
  const scaleY = (cssH - PAD * 2) / planner.yardD;
  planner.scale   = Math.min(scaleX, scaleY, 22);
  planner.offsetX = (cssW - planner.yardW * planner.scale) / 2;
  planner.offsetY = (cssH - planner.yardD * planner.scale) / 2;
  draw();
}

/* ── DRAW ──────────────────────────────────────────────── */
function draw() {
  const cssW = canvas.clientWidth;
  const cssH = canvas.clientHeight;
  if (!cssW || !cssH) return;

  ctx.clearRect(0, 0, cssW, cssH);

  const ox = planner.offsetX, oy = planner.offsetY;
  const yw = ftToPx(planner.yardW);
  const yd = ftToPx(planner.yardD);

  // Yard fill
  ctx.fillStyle = '#ECF2E8';
  rrPath(ox, oy, yw, yd, 6); ctx.fill();

  // Grid
  ctx.strokeStyle = 'rgba(147,152,165,0.18)';
  ctx.lineWidth = 0.75;
  for (let x = 0; x <= planner.yardW; x += 5) {
    const px = ox + ftToPx(x);
    ctx.beginPath(); ctx.moveTo(px, oy); ctx.lineTo(px, oy + yd); ctx.stroke();
  }
  for (let y = 0; y <= planner.yardD; y += 5) {
    const py = oy + ftToPx(y);
    ctx.beginPath(); ctx.moveTo(ox, py); ctx.lineTo(ox + yw, py); ctx.stroke();
  }

  // Yard border
  ctx.strokeStyle = '#535266';
  ctx.lineWidth = 2;
  rrPath(ox, oy, yw, yd, 6); ctx.stroke();

  // Yard dimension labels
  ctx.fillStyle = 'rgba(83,82,102,0.45)';
  ctx.font = '500 ' + Math.max(10, Math.round(ftToPx(0.7))) + 'px Inter,system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(planner.yardW + ' ft', ox + yw / 2, oy - 9);
  ctx.save();
  ctx.translate(ox - 11, oy + yd / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(planner.yardD + ' ft', 0, 0);
  ctx.restore();

  // Yard objects (drawn under pod)
  drawObjects();

  // Pod
  const { w, h } = podDims();
  const [pcx, pcy] = yardToCanvas(planner.podX, planner.podY);
  const pw = ftToPx(w), ph = ftToPx(h);
  const pL = pcx - pw / 2, pT = pcy - ph / 2;

  // Shadow
  ctx.fillStyle = 'rgba(83,82,102,0.1)';
  rrPath(pL + 3, pT + 5, pw, ph, 5); ctx.fill();

  // Pod fill
  ctx.fillStyle = 'rgba(83,82,102,0.9)';
  rrPath(pL, pT, pw, ph, 5); ctx.fill();

  // Pod border
  ctx.strokeStyle = '#3d3c52';
  ctx.lineWidth = 1.5;
  rrPath(pL, pT, pw, ph, 5); ctx.stroke();

  // Pod inner line
  const inset = Math.min(pw, ph) * 0.1;
  if (inset > 3) {
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    rrPath(pL + inset, pT + inset, pw - inset * 2, ph - inset * 2, 3);
    ctx.stroke();
  }

  // Pod name label
  const nfs = Math.max(9, Math.min(13, Math.round(pw * 0.12)));
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = '600 ' + nfs + 'px Inter,system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(planner.pod.name, pcx, pcy - 2);
  ctx.font = '400 ' + Math.max(8, nfs - 2) + 'px Inter,system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(w + ' x ' + h + ' ft', pcx, pcy + nfs + 1);
  ctx.textAlign = 'left';

  updateToast();
}

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ── YARD OBJECTS ──────────────────────────────────────── */
function drawObjects() {
  planner.objects.forEach((obj, i) => {
    const [cx, cy] = yardToCanvas(obj.x, obj.y);
    const pw = ftToPx(obj.w), ph = ftToPx(obj.h);
    const sel = planner.selectedObj === i;
    const def = obj.def;

    ctx.save();
    ctx.globalAlpha = 0.88;

    if (def.shape === 'circle') {
      const r = ftToPx(obj.w / 2);
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.beginPath(); ctx.arc(cx + 2, cy + 3, r, 0, Math.PI * 2); ctx.fill();
      // Fill
      ctx.fillStyle = def.fill;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = def.stroke; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      // Label
      const lfs = Math.max(8, Math.min(11, Math.round(r * 0.55)));
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.font = '600 ' + lfs + 'px Inter,system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(def.label, cx, cy + lfs * 0.38);
    } else {
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      rrPath(cx - pw/2 + 2, cy - ph/2 + 4, pw, ph, 4); ctx.fill();
      // Fill
      ctx.fillStyle = def.fill;
      rrPath(cx - pw/2, cy - ph/2, pw, ph, 4); ctx.fill();
      ctx.strokeStyle = def.stroke; ctx.lineWidth = 1.5;
      rrPath(cx - pw/2, cy - ph/2, pw, ph, 4); ctx.stroke();
      // Label
      const lfs = Math.max(8, Math.min(11, Math.round(Math.min(pw, ph) * 0.12)));
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.font = '600 ' + lfs + 'px Inter,system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(def.label, cx, cy + lfs * 0.38);
    }

    ctx.globalAlpha = 1;

    // Selection ring
    if (sel) {
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      if (def.shape === 'circle') {
        const r = ftToPx(obj.w / 2) + 5;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      } else {
        rrPath(cx - pw/2 - 5, cy - ph/2 - 5, pw + 10, ph + 10, 7); ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    ctx.textAlign = 'left';
    ctx.restore();
  });
}

function hitTestObject(cx, cy, i) {
  const obj = planner.objects[i];
  const [ocx, ocy] = yardToCanvas(obj.x, obj.y);
  const exp = 12;
  if (obj.def.shape === 'circle') {
    const r = ftToPx(obj.w / 2) + exp;
    return Math.hypot(cx - ocx, cy - ocy) <= r;
  }
  const pw = ftToPx(obj.w), ph = ftToPx(obj.h);
  return cx >= ocx - pw/2 - exp && cx <= ocx + pw/2 + exp &&
         cy >= ocy - ph/2 - exp && cy <= ocy + ph/2 + exp;
}

function addObject(type) {
  const def = YARD_OBJECT_DEFS[type];
  const sameType = planner.objects.filter(o => o.type === type).length;
  const offset = sameType * 1.5;
  const x = Math.max(def.w/2, Math.min(planner.yardW - def.w/2, planner.yardW/2 + offset));
  const y = Math.max(def.h/2, Math.min(planner.yardD - def.h/2, planner.yardD/2 - def.h/2 - 2 - offset));
  planner.objects.push({ type, x, y, w: def.w, h: def.h, def });
  planner.selectedObj = planner.objects.length - 1;
  draw();
}

/* ── TOAST ─────────────────────────────────────────────── */
function updateToast() {
  const toast = document.getElementById('clearance-toast');
  if (!toast) return;

  if (planner.selectedObj >= 0 && planner.selectedObj < planner.objects.length) {
    const obj = planner.objects[planner.selectedObj];
    toast.textContent = obj.def.label + ' selected. Tap again to remove.';
    toast.classList.remove('warning');
    return;
  }

  const { w, h } = podDims();
  const minC = Math.min(
    planner.podX - w / 2,
    planner.yardW - (planner.podX + w / 2),
    planner.podY - h / 2,
    planner.yardD - (planner.podY + h / 2)
  );
  const good = minC >= 3;
  toast.textContent = good
    ? minC.toFixed(1) + ' ft clearance. Good placement.'
    : minC.toFixed(1) + ' ft clearance. Leave about 3 ft around the pod.';
  toast.classList.toggle('warning', !good);
}

/* ── CENTER POD ────────────────────────────────────────── */
function centerPod() {
  planner.podX = planner.yardW / 2;
  planner.podY = planner.yardD / 2;
  [planner.podX, planner.podY] = clampPod(planner.podX, planner.podY);
}

/* ── INTERACTION ───────────────────────────────────────── */
function getCanvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return [src.clientX - rect.left, src.clientY - rect.top];
}

function hitTest(cx, cy) {
  const { w, h } = podDims();
  const [pcx, pcy] = yardToCanvas(planner.podX, planner.podY);
  const pw = ftToPx(w), ph = ftToPx(h);
  const e = HIT_EXPAND;
  return cx >= pcx - pw/2 - e && cx <= pcx + pw/2 + e &&
         cy >= pcy - ph/2 - e && cy <= pcy + ph/2 + e;
}

function inYard(cx, cy) {
  const ox = planner.offsetX, oy = planner.offsetY;
  return cx >= ox && cx <= ox + ftToPx(planner.yardW) &&
         cy >= oy && cy <= oy + ftToPx(planner.yardD);
}

canvas.addEventListener('mousedown', pointerDown);
canvas.addEventListener('touchstart', pointerDown, { passive: false });

function pointerDown(e) {
  const [cx, cy] = getCanvasXY(e);
  const [fx, fy] = canvasToYard(cx, cy);

  // Check objects in reverse order (last added = on top)
  for (let i = planner.objects.length - 1; i >= 0; i--) {
    if (hitTestObject(cx, cy, i)) {
      if (e.cancelable) e.preventDefault();
      if (planner.selectedObj === i) {
        // Second tap on selected object: remove it
        planner.objects.splice(i, 1);
        planner.selectedObj = -1;
        draw();
        return;
      }
      // First tap: select and prepare drag
      planner.selectedObj = i;
      planner.dragging = true;
      planner.dragTarget = i;
      planner.dragOffX = fx - planner.objects[i].x;
      planner.dragOffY = fy - planner.objects[i].y;
      draw();
      return;
    }
  }

  // Check pod
  if (hitTest(cx, cy)) {
    if (e.cancelable) e.preventDefault();
    planner.selectedObj = -1;
    planner.dragging = true;
    planner.dragTarget = 'pod';
    planner.dragOffX = fx - planner.podX;
    planner.dragOffY = fy - planner.podY;
  } else if (inYard(cx, cy)) {
    if (e.cancelable) e.preventDefault();
    planner.selectedObj = -1;
    [planner.podX, planner.podY] = clampPod(fx, fy);
    draw();
  } else {
    planner.selectedObj = -1;
    draw();
  }
}

window.addEventListener('mousemove', pointerMove);
canvas.addEventListener('touchmove', touchMove, { passive: false });

function applyDrag(fx, fy) {
  if (planner.dragTarget === 'pod') {
    [planner.podX, planner.podY] = clampPod(fx - planner.dragOffX, fy - planner.dragOffY);
  } else {
    const i   = planner.dragTarget;
    const obj = planner.objects[i];
    obj.x = Math.max(obj.w/2, Math.min(planner.yardW - obj.w/2, fx - planner.dragOffX));
    obj.y = Math.max(obj.h/2, Math.min(planner.yardD - obj.h/2, fy - planner.dragOffY));
  }
}

function pointerMove(e) {
  if (!planner.dragging) return;
  const [cx, cy] = getCanvasXY(e);
  applyDrag(...canvasToYard(cx, cy));
  draw();
}

function touchMove(e) {
  if (!planner.dragging) return;
  if (e.cancelable) e.preventDefault();
  const [cx, cy] = getCanvasXY(e);
  applyDrag(...canvasToYard(cx, cy));
  draw();
}

window.addEventListener('mouseup',  () => { planner.dragging = false; });
window.addEventListener('touchend', () => { planner.dragging = false; });

/* ── POD SELECTION ─────────────────────────────────────── */
function selectPod(id) {
  planner.pod = PODS.find(p => p.id === id);
  document.querySelectorAll('.pod-tab').forEach(el =>
    el.classList.toggle('active', el.dataset.pod === id));
  document.querySelectorAll('.pod-tab').forEach(el =>
    el.setAttribute('aria-selected', String(el.dataset.pod === id)));
  document.querySelectorAll('.sidebar-pod-card').forEach(el =>
    el.classList.toggle('active', el.dataset.pod === id));
  centerPod();
  draw();
}

document.querySelectorAll('.pod-tab, .sidebar-pod-card').forEach(btn =>
  btn.addEventListener('click', () => selectPod(btn.dataset.pod)));

/* ── ORIENTATION ───────────────────────────────────────── */
function setRotation(deg) {
  planner.rotation = deg;
  document.querySelectorAll('.orient-btn').forEach(btn =>
    btn.classList.toggle('active', +btn.dataset.rotation === deg));
  centerPod();
  draw();
}

document.querySelectorAll('.orient-btn').forEach(btn =>
  btn.addEventListener('click', () => setRotation(+btn.dataset.rotation)));

/* ── POD USE ───────────────────────────────────────────── */
function setPodUse(use) {
  planner.podUse = use;
  document.querySelectorAll('.pod-use-btn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.use === use));
}

document.querySelectorAll('.pod-use-btn').forEach(btn =>
  btn.addEventListener('click', () => setPodUse(btn.dataset.use)));

/* ── YARD OBJECT BUTTONS ───────────────────────────────── */
document.querySelectorAll('.add-obj-btn').forEach(btn =>
  btn.addEventListener('click', () => addObject(btn.dataset.objType)));

/* ── YARD DIMENSIONS ───────────────────────────────────── */
const yardInputIds = ['yard-w-mobile', 'yard-d-mobile', 'yard-w-sidebar', 'yard-d-sidebar'];

function syncYardInput(id) {
  const val = Math.max(10, Math.min(200, parseInt(document.getElementById(id).value) || 10));
  const isWidth = id.includes('-w-');
  if (isWidth) planner.yardW = val; else planner.yardD = val;
  // Keep both inputs in sync
  yardInputIds.filter(i => i.includes(isWidth ? '-w-' : '-d-')).forEach(i => {
    const el = document.getElementById(i);
    if (el && el !== document.getElementById(id)) el.value = val;
  });
  centerPod();
  fitToView();
}

yardInputIds.forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', () => syncYardInput(id));
});

/* ── SETTINGS SHEET TOGGLE ─────────────────────────────── */
const settingsFab  = document.getElementById('settings-fab');
const settingsSheet = document.getElementById('settings-sheet');
const sheetBackdrop = document.getElementById('sheet-backdrop');

function openSheet() {
  settingsSheet && settingsSheet.classList.add('open');
  sheetBackdrop && sheetBackdrop.classList.add('visible');
  settingsFab && settingsFab.setAttribute('aria-expanded', 'true');
}

function closeSheet() {
  settingsSheet && settingsSheet.classList.remove('open');
  sheetBackdrop && sheetBackdrop.classList.remove('visible');
  settingsFab && settingsFab.setAttribute('aria-expanded', 'false');
}

if (settingsFab) {
  settingsFab.addEventListener('click', () => {
    const open = settingsFab.getAttribute('aria-expanded') === 'true';
    open ? closeSheet() : openSheet();
  });
}

if (sheetBackdrop) {
  sheetBackdrop.addEventListener('click', closeSheet);
}

/* ── PLANNER INIT ──────────────────────────────────────── */
function initPlanner() {
  centerPod();
  resizeObs.observe(canvas.parentElement);
  resizeCanvas();
  // Pin toast below the actual rendered tab bar height (avoids clipping on real devices)
  const tabs  = document.querySelector('.planner-pod-tabs');
  const toast = document.getElementById('clearance-toast');
  if (tabs && toast) {
    const pinToast = () => { toast.style.top = (tabs.offsetHeight + 10) + 'px'; };
    pinToast();
    new ResizeObserver(pinToast).observe(tabs);
  }
}

/* ── INIT ─────────────────────────────────────────────────── */
function init() {
  loadState();
  // Screen 2 keeps the planner snapshot. Without one there is nothing to return to.
  const snap = window.MiniOAssessment.restore();
  if (!snap) state.currentStep = 0;
  else if (state.currentStep !== 0) state.currentStep = 1;
  render();
  initPlanner();
  if (snap) restorePlanner(snap);
}

document.addEventListener('minio:edit-yard', () => {
  state.currentStep = 0;
  saveState();
  render();
});

init();
</script>
